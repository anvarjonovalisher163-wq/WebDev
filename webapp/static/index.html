<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Reyting</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" />
<link rel="stylesheet" href="/static/theme.css?v=1" />
<meta name="theme-color" content="#000000" />
<style>
  body { padding-bottom: 104px; }

  /* ---------- Tab paneli: hero ostida yopishqoq ---------- */
  .tabbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px; padding: 12px var(--gutter);
    background: var(--bg); border-bottom: 1px solid var(--line-soft);
  }
  .tabbar-inner { display: flex; gap: 8px; width: 100%; max-width: var(--page-max); margin: 0 auto; }

  /* ---------- Podium: tahririy uch ustun ---------- */
  .podium {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px;
    margin-top: 40px;
  }
  .podium-slot { display: flex; flex-direction: column; align-items: stretch; min-width: 0; }
  .podium-avatar-wrap { margin-bottom: 10px; }
  .podium-slot .avatar { width: 56px; height: 56px; font-size: 20px; }
  .podium-slot.p1 .avatar { width: 76px; height: 76px; font-size: 28px; }
  .podium-name {
    font-size: 14px; line-height: 1.2; margin-bottom: 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .podium-block {
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--line); padding: 10px 10px 12px;
  }
  .podium-slot.p1 .podium-block { height: 132px; background: var(--fg); color: var(--bg); }
  .podium-slot.p2 .podium-block { height: 100px; }
  .podium-slot.p3 .podium-block { height: 80px; }
  .podium-rank { font-weight: 300; font-size: 45px; line-height: 0.76; }
  .podium-slot.p1 .podium-rank { font-size: 78px; }
  .podium-count { font-size: var(--text-caption); line-height: 1.19; }

  /* ---------- Ro'yxat ---------- */
  .list { margin-top: var(--section-gap); border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--line-soft);
    transition: background-color 0.8s var(--ease), color 0.8s var(--ease), padding 0.8s var(--ease);
  }
  .row .rank { width: 28px; flex-shrink: 0; font-size: var(--text-caption); color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .name { flex: 1; min-width: 0; font-size: var(--text-body-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .count { font-size: var(--text-body-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row.you-row { background: var(--fg); color: var(--bg); padding-left: 12px; padding-right: 12px; }
  .row.you-row .rank { color: inherit; opacity: 0.7; }
  .row.clickable { cursor: pointer; }
  .row.clickable::after {
    content: "+"; width: 16px; text-align: center; font-weight: 300; font-size: 22px; line-height: 1;
    transition: transform 0.8s var(--ease);
  }
  .row.clickable.open::after { transform: rotate(45deg); }
  .podium-slot.clickable { cursor: pointer; }

  /* ---------- Admin: kimlarni taklif qilgani (ichki panel) ---------- */
  .referral-expand, #podium-expand { background: var(--inset); padding: 6px 16px; }
  .referral-expand { margin: 0 0 8px; }
  #podium-expand { margin-top: 20px; display: none; }
  .re-title { padding-top: 10px; }
  .re-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .re-row:last-child { border-bottom: none; }
  .re-row .avatar { width: 32px; height: 32px; font-size: 13px; }
  .re-row .re-info { flex: 1; min-width: 0; }
  .re-row .re-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
  .re-row .re-count { font-size: 14px; white-space: nowrap; }
  .re-empty, .re-loading { color: var(--muted); font-size: var(--text-caption); padding: 10px 0; }

  /* ---------- "Siz" paneli: shaffof slate pill ---------- */
  .you-bar {
    position: fixed; left: var(--gutter); right: var(--gutter); bottom: 16px; z-index: 10;
    max-width: calc(var(--page-max) - 2 * var(--gutter)); margin: 0 auto;
    display: none; align-items: center; gap: 12px;
    padding: 8px 22px 8px 8px; border-radius: var(--radius-pill);
    background: var(--scrim); color: var(--color-paper); border: 1px solid rgba(255,255,255,0.3);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    animation: rise 1.25s var(--ease) both;
  }
  .you-bar .avatar { width: 36px; height: 36px; font-size: 14px; border-radius: var(--radius-pill); }
  .you-bar .rank { font-size: var(--text-caption); opacity: 0.75; font-variant-numeric: tabular-nums; }
  .you-bar .name { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .you-bar .badge { margin-left: 6px; padding: 2px 9px; border: 1px solid rgba(255,255,255,0.5); border-radius: var(--radius-pill); font-size: 11px; }
  .you-bar .count { font-size: 15px; white-space: nowrap; }

  /* ---------- Mening natijam ---------- */
  .stats-card { padding-top: 32px; }
  .big-progress { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 20px 0 24px; }
  .big-progress .num { font-weight: 300; font-size: clamp(78px, 26vw, 152px); line-height: 0.76; }
  .big-progress .of { font-size: 14px; color: var(--muted); }
  .progress-track { height: 2px; background: var(--line-soft); margin-bottom: var(--section-gap); }
  .progress-fill { height: 100%; background: var(--fg); transition: width 1.25s var(--ease); }
  .stat-row-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: var(--section-gap); }
  .stat-tile { border-top: 1px solid var(--line); padding-top: 10px; }
  .stat-tile .n { font-weight: 300; font-size: clamp(29px, 9vw, 45px); line-height: 1.15; }
  .stat-tile .l { margin-top: 4px; }
  .line-item {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 16px 0; border-top: 1px solid var(--line-soft);
  }
  .line-item:last-child { border-bottom: 1px solid var(--line-soft); }
  .line-item .eyebrow { flex-shrink: 0; white-space: nowrap; }
  .line-item .text { font-size: var(--text-body-sm); text-align: right; }
  .line-item .mark { margin-right: 8px; }
  .line-item .v { font-weight: 300; font-size: 29px; line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
  <header class="hero">
    <div class="iri" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <nav class="hero-nav">
      <span class="wordmark">uchqun</span>
      <span class="eyebrow" style="color: rgba(255,255,255,0.82);">Mavsum reytingi</span>
    </nav>
    <div>
      <p class="hero-meta" id="season-label">Yuklanmoqda...</p>
      <h1 class="hero-title">Reyting</h1>
    </div>
    <svg class="spin-badge" viewBox="0 0 100 100" aria-hidden="true">
      <defs><path id="badge-circle" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0" /></defs>
      <text><textPath href="#badge-circle">PASTGA SURING · PASTGA SURING ·</textPath></text>
    </svg>
  </header>

  <div class="tabbar">
    <div class="tabbar-inner">
      <button id="tab-btn-reyting" class="pill sm active" onclick="showTab('reyting')">Reyting</button>
      <button id="tab-btn-mine" class="pill sm" onclick="showTab('mine')">Mening natijam</button>
    </div>
  </div>

  <main class="wrap" style="padding-bottom: 32px;">
    <div id="panel-reyting">
      <div id="podium" class="podium"></div>
      <div id="podium-expand"></div>
      <div id="list" class="list"><div class="loading">Yuklanmoqda...</div></div>
    </div>

    <div id="panel-mine" style="display:none;">
      <div id="stats-card" class="stats-card"><div class="loading">Yuklanmoqda...</div></div>
    </div>
  </main>

  <div id="you-bar" class="you-bar"></div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready(); tg.expand();
      // Telegram sarlavhasi qora hero bilan bir butun ko'rinishi uchun
      try { tg.setHeaderColor("#000000"); } catch (e) {}
    }

    // Monoxrom tizim: bosh harfli avatarlar faqat kulrang tuslarda
    const PALETTE = ["#181818", "#2e2e2e", "#454545", "#636363", "#808080", "#6d6d6d"];

    function initials(name) {
      return (name || "?").trim().charAt(0).toUpperCase();
    }
    function colorFor(name) {
      let sum = 0;
      for (const ch of (name || "?")) sum += ch.charCodeAt(0);
      return PALETTE[sum % PALETTE.length];
    }
    function avatarHtml(name, tgId, extraClass) {
      const img = tgId
        ? `<img src="/api/avatar/${tgId}" alt="" loading="lazy" style="display:none" onerror="this.style.display='none'" onload="this.style.display='block'" />`
        : "";
      return `<div class="avatar ${extraClass || ''}" style="background:${colorFor(name)}"><span>${initials(name)}</span>${img}</div>`;
    }

    let offset = 0;
    let limit = 30;
    let total = Infinity;
    let loading = false;
    let renderedFirstPage = false;
    let isAdmin = false;

    async function fetchPage(nextOffset) {
      const headers = {};
      if (tg && tg.initData) headers["X-Telegram-Init-Data"] = tg.initData;
      const res = await fetch(`/api/leaderboard?offset=${nextOffset}&limit=${limit}`, { headers });
      return res.json();
    }

    // --- Admin: profilga bosganda kimlarni taklif qilgani ko'rsatish ---
    const REFERRAL_STATUS_LABEL = {
      approved: "tasdiqlangan",
      pending: "kutilmoqda",
      cancelled: "bekor qilingan",
      fraud: "shubhali",
      left_channels: "kanaldan chiqib ketgan",
    };
    const referralsCache = {};

    async function fetchReferrals(tgId) {
      if (referralsCache[tgId]) return referralsCache[tgId];
      const headers = {};
      if (tg && tg.initData) headers["X-Telegram-Init-Data"] = tg.initData;
      const res = await fetch(`/api/admin/user-referrals/${tgId}`, { headers });
      if (!res.ok) throw new Error("bad status");
      const data = await res.json();
      referralsCache[tgId] = data;
      return data;
    }

    function referralsListHtml(data) {
      if (!data.referrals.length) {
        return '<div class="re-empty">Hali hech kimni taklif qilmagan.</div>';
      }
      return data.referrals
        .map((r) => {
          const statusClass = r.status === "approved" ? "filled" : r.status === "pending" ? "" : "quiet";
          const label = REFERRAL_STATUS_LABEL[r.status] || r.status;
          return `
            <div class="re-row">
              ${avatarHtml(r.name, r.tg_id)}
              <div class="re-info">
                <div class="re-name">${r.name}${r.username ? " @" + r.username : ""}</div>
                <span class="tag ${statusClass}">${label}</span>
              </div>
              <div class="re-count">${r.referred_count} ta</div>
            </div>
          `;
        })
        .join("");
    }

    async function toggleRowExpand(rowEl, tgId) {
      const existing = rowEl.nextElementSibling;
      if (existing && existing.classList.contains("referral-expand")) {
        existing.remove();
        rowEl.classList.remove("open");
        return;
      }
      document.querySelectorAll(".referral-expand").forEach((el) => el.remove());
      document.querySelectorAll(".row.open").forEach((el) => el.classList.remove("open"));
      rowEl.classList.add("open");

      const expandEl = document.createElement("div");
      expandEl.className = "referral-expand rise";
      expandEl.innerHTML = '<div class="re-loading">Yuklanmoqda...</div>';
      rowEl.after(expandEl);

      try {
        const data = await fetchReferrals(tgId);
        expandEl.innerHTML = referralsListHtml(data);
      } catch (e) {
        expandEl.innerHTML = '<div class="re-empty">Yuklab bo\'lmadi.</div>';
      }
    }

    async function togglePodiumExpand(tgId, name) {
      const el = document.getElementById("podium-expand");
      if (el.dataset.tgid === String(tgId) && el.style.display === "block") {
        el.style.display = "none";
        el.dataset.tgid = "";
        return;
      }
      el.dataset.tgid = String(tgId);
      el.style.display = "block";
      el.innerHTML = `<div class="re-title eyebrow">${name} taklif qilganlar</div><div class="re-loading">Yuklanmoqda...</div>`;

      try {
        const data = await fetchReferrals(tgId);
        el.innerHTML = `<div class="re-title eyebrow">${name} taklif qilganlar</div>${referralsListHtml(data)}`;
      } catch (e) {
        el.innerHTML = `<div class="re-title eyebrow">${name} taklif qilganlar</div><div class="re-empty">Yuklab bo'lmadi.</div>`;
      }
    }

    function renderPodium(entries) {
      const podiumEl = document.getElementById("podium");
      const top3 = entries.filter((e) => e.rank <= 3);
      if (!top3.length) { podiumEl.style.display = "none"; return; }

      const bySlot = {};
      top3.forEach((e) => { bySlot[e.rank] = e; });

      let html = "";
      [2, 1, 3].forEach((rank) => {
        const e = bySlot[rank];
        if (!e) { html += `<div class="podium-slot p${rank}"></div>`; return; }
        html += `
          <div class="podium-slot rise p${rank}${isAdmin ? ' clickable' : ''}" style="animation-delay:${rank === 1 ? 0 : rank * 80}ms" ${isAdmin ? `data-tgid="${e.tg_id}" data-name="${e.name}"` : ''}>
            <div class="podium-avatar-wrap">
              ${avatarHtml(e.name, e.tg_id)}
            </div>
            <div class="podium-name">${e.name}${e.is_you ? " (siz)" : ""}</div>
            <div class="podium-block"><div class="podium-rank">${rank}</div><div class="podium-count">${e.count} ta</div></div>
          </div>
        `;
      });
      podiumEl.innerHTML = html;

      if (isAdmin) {
        podiumEl.querySelectorAll(".podium-slot.clickable").forEach((slot) => {
          slot.addEventListener("click", () => togglePodiumExpand(slot.dataset.tgid, slot.dataset.name));
        });
      }
    }

    function renderRows(entries, append) {
      const listEl = document.getElementById("list");
      if (!append) listEl.innerHTML = "";
      const rest = entries.filter((e) => e.rank > 3);
      if (!rest.length && !append && !entries.length) {
        listEl.innerHTML = '<div class="empty">Hali hech kim tasdiqlangan taklif qilmagan.<br>Birinchi bo\'ling!</div>';
        return;
      }
      rest.forEach((e, i) => {
        const row = document.createElement("div");
        row.className = "row rise" + (e.is_you ? " you-row" : "") + (isAdmin ? " clickable" : "");
        row.style.animationDelay = `${Math.min(i, 12) * 40}ms`;
        row.innerHTML = `
          <div class="rank">${e.rank}</div>
          ${avatarHtml(e.name, e.tg_id)}
          <div class="name">${e.name}${e.is_you ? " (siz)" : ""}</div>
          <div class="count">${e.count} ta</div>
        `;
        if (isAdmin) row.addEventListener("click", () => toggleRowExpand(row, e.tg_id));
        listEl.appendChild(row);
      });
    }

    let lastYou = null;
    let currentTab = "reyting";

    function renderYouBar(you) {
      lastYou = you;
      const bar = document.getElementById("you-bar");
      if (!you || currentTab !== "reyting") { bar.style.display = "none"; return; }
      bar.style.display = "flex";
      bar.innerHTML = `
        <div class="rank">${you.rank}</div>
        ${avatarHtml(you.name, you.tg_id)}
        <div class="name">${you.name} <span class="badge">Siz</span></div>
        <div class="count">${you.count} ta</div>
      `;
    }

    async function loadMore() {
      if (loading || offset >= total) return;
      loading = true;

      const listEl = document.getElementById("list");
      const loadingRow = document.createElement("div");
      loadingRow.className = "list-loading";
      loadingRow.textContent = "Yuklanmoqda...";
      if (renderedFirstPage) listEl.appendChild(loadingRow);

      try {
        const data = await fetchPage(offset);
        total = data.total;
        isAdmin = !!data.is_admin;
        document.getElementById("season-label").textContent = `${data.season.name} · ${data.total} ishtirokchi`;

        if (!renderedFirstPage) {
          renderPodium(data.entries);
          renderRows(data.entries, false);
          renderedFirstPage = true;
        } else {
          loadingRow.remove();
          renderRows(data.entries, true);
        }

        renderYouBar(data.you);
        offset += data.entries.length;
        if (data.entries.length === 0) total = offset; // himoya: cheksiz aylanishning oldini olish
      } finally {
        loadingRow.remove();
        loading = false;
        // Emojilarni barcha qurilmalarda bir xil (Twemoji) ko'rinishga o'tkazish
        if (window.twemoji) window.twemoji.parse(document.body);
      }
    }

    window.addEventListener("scroll", () => {
      if (currentTab !== "reyting") return;
      const scrollBottom = window.innerHeight + window.scrollY;
      const threshold = document.body.offsetHeight - 500;
      if (scrollBottom >= threshold) loadMore().catch(() => {});
    });

    const CHANNEL_STATUS = {
      joined: { icon: "●", text: "Siz allaqachon yopiq kanaldasiz" },
      pending: { icon: "◐", text: "Havola berilgan, kanalga qo'shilishni kutmoqda" },
      none: { icon: "○", text: "Maxfiy kanal hali olinmagan" },
    };

    let myStatsLoaded = false;

    async function loadMyStats() {
      const cardEl = document.getElementById("stats-card");
      const headers = {};
      if (tg && tg.initData) headers["X-Telegram-Init-Data"] = tg.initData;
      if (!tg || !tg.initData) {
        cardEl.innerHTML = '<div class="empty">Bu bo\'lim faqat Telegram ichida ochilganda ishlaydi.</div>';
        return;
      }

      try {
        const res = await fetch("/api/my-stats", { headers });
        if (!res.ok) throw new Error("bad status");
        const data = await res.json();
        const p = data.progress;
        const pct = p.required > 0 ? Math.min(100, Math.round((p.approved / p.required) * 100)) : 0;
        const channel = CHANNEL_STATUS[data.channel_status] || CHANNEL_STATUS.none;

        cardEl.innerHTML = `
          <div class="eyebrow">${data.season.name} · joriy natijangiz</div>
          <div class="big-progress rise"><span class="num">${p.approved}</span><span class="of">/ ${p.required} ta talab qilingan taklif</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:0%" data-pct="${pct}"></div></div>
          <div class="stat-row-grid">
            <div class="stat-tile"><div class="n">${p.approved}</div><div class="l eyebrow">Tasdiqlangan</div></div>
            <div class="stat-tile"><div class="n">${p.pending}</div><div class="l eyebrow">Kutilmoqda</div></div>
            <div class="stat-tile"><div class="n">${p.remaining}</div><div class="l eyebrow">Qolgan</div></div>
          </div>
          <div class="line-item"><div class="eyebrow">Maxfiy kanal</div><div class="text"><span class="mark">${channel.icon}</span>${channel.text}</div></div>
          ${data.rank ? `<div class="line-item"><div class="eyebrow">Joriy mavsumdagi o'rningiz</div><div class="v">${data.rank}-o'rin</div></div>` : ""}
        `;
        // Progress chizig'i sekin "sirpanib" to'lishi uchun keyingi kadrda kengligini beramiz
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const fill = cardEl.querySelector(".progress-fill");
          if (fill) fill.style.width = fill.dataset.pct + "%";
        }));
        if (window.twemoji) window.twemoji.parse(cardEl);
      } catch (e) {
        cardEl.innerHTML = '<div class="empty">Ma\'lumotni yuklab bo\'lmadi. Keyinroq urinib ko\'ring.</div>';
      }
    }

    function showTab(tab) {
      currentTab = tab;
      document.getElementById("panel-reyting").style.display = tab === "reyting" ? "block" : "none";
      document.getElementById("panel-mine").style.display = tab === "mine" ? "block" : "none";
      document.getElementById("tab-btn-reyting").classList.toggle("active", tab === "reyting");
      document.getElementById("tab-btn-mine").classList.toggle("active", tab === "mine");

      const bar = document.getElementById("you-bar");
      if (tab !== "reyting") bar.style.display = "none";
      else if (lastYou) renderYouBar(lastYou);

      if (tab === "mine" && !myStatsLoaded) {
        myStatsLoaded = true;
        loadMyStats();
      }
    }

    // Mening takliflarim tugmasi Mini App'ni to'g'ridan-to'g'ri shu tabga ochishi uchun (?tab=mine)
    const initialTab = new URLSearchParams(location.search).get("tab") === "mine" ? "mine" : "reyting";
    showTab(initialTab);

    loadMore().catch(() => {
      document.getElementById("list").innerHTML = '<div class="empty">Ma\'lumotni yuklab bo\'lmadi. Keyinroq urinib ko\'ring.</div>';
    });
  </script>
</body>
</html>
