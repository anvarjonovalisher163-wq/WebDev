<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Reyting</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .header {
    padding: 20px 16px 12px;
    text-align: center;
  }
  .header h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  .header p {
    margin: 0;
    color: var(--hint);
    font-size: 14px;
  }
  .list {
    padding: 8px 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .row.you {
    outline: 2px solid var(--accent);
  }
  .rank {
    min-width: 32px;
    text-align: center;
    font-weight: 700;
    font-size: 16px;
    color: var(--hint);
  }
  .row.top1 .rank { font-size: 22px; }
  .row.top2 .rank { font-size: 20px; }
  .row.top3 .rank { font-size: 20px; }
  .name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .count {
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    white-space: nowrap;
  }
  .empty, .loading {
    text-align: center;
    color: var(--hint);
    padding: 40px 16px;
  }
  .you-banner {
    margin: 4px 12px 0;
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px dashed var(--accent);
  }
</style>
</head>
<body>
  <div class="header">
    <h1>🏆 Reyting</h1>
    <p id="season-label">Yuklanmoqda...</p>
  </div>
  <div id="you-banner"></div>
  <div id="list" class="list"><div class="loading">Yuklanmoqda...</div></div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function medalOrRank(rank) {
      if (rank === 1) return "🥇";
      if (rank === 2) return "🥈";
      if (rank === 3) return "🥉";
      return rank + ".";
    }

    async function loadLeaderboard() {
      const headers = {};
      if (tg && tg.initData) {
        headers["X-Telegram-Init-Data"] = tg.initData;
      }
      const res = await fetch("/api/leaderboard", { headers });
      const data = await res.json();

      document.getElementById("season-label").textContent = data.season.name;

      const listEl = document.getElementById("list");
      listEl.innerHTML = "";

      if (!data.entries.length) {
        listEl.innerHTML = '<div class="empty">Hali hech kim tasdiqlangan taklif qilmagan.<br>Birinchi bo\'ling!</div>';
        return;
      }

      data.entries.forEach((entry) => {
        const row = document.createElement("div");
        row.className = "row" + (entry.is_you ? " you" : "") + (entry.rank <= 3 ? " top" + entry.rank : "");
        row.innerHTML = `
          <div class="rank">${medalOrRank(entry.rank)}</div>
          <div class="name">${entry.name}${entry.is_you ? " (siz)" : ""}</div>
          <div class="count">${entry.count} ta</div>
        `;
        listEl.appendChild(row);
      });

      const banner = document.getElementById("you-banner");
      if (data.you) {
        banner.innerHTML = `
          <div class="you-banner">
            <span>Sizning o'rningiz: <b>${data.you.rank}-o'rin</b></span>
            <span class="count">${data.you.count} ta</span>
          </div>
        `;
      }
    }

    loadLeaderboard().catch(() => {
      document.getElementById("list").innerHTML = '<div class="empty">Ma\'lumotni yuklab bo\'lmadi. Keyinroq urinib ko\'ring.</div>';
    });
  </script>
</body>
</html>
