<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Marra</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" />
<link rel="stylesheet" href="/static/theme.css?v=1" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  main.wrap { padding-top: 32px; padding-bottom: 48px; }
  .about { margin-bottom: var(--section-gap); }
  .about .lead { margin-bottom: 20px; }
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .kv:last-child { border-bottom: 1px solid var(--line-soft); }
  .kv .v { text-align: right; }

  .progress-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .progress-label #progress-text { font-weight: 300; font-size: clamp(45px, 14vw, 78px); line-height: 0.9; }
  .progress-label #progress-pct { font-size: var(--text-caption); color: var(--muted); }
  .progress-wrap { height: 2px; background: var(--line-soft); margin: 16px 0 28px; }
  .progress-bar { height: 100%; width: 0%; background: var(--fg); transition: width 1.25s var(--ease); }

  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .day {
    width: 34px; height: 34px; border-radius: var(--radius-pill);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--text-caption); border: 1px solid var(--line-soft); color: var(--muted);
    transition: background-color 0.8s var(--ease), color 0.8s var(--ease), border-color 0.8s var(--ease);
  }
  .day.done { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .day.today { border-color: var(--fg); color: var(--fg); }
  .day.today.done { color: var(--bg); }

  .book-text {
    white-space: pre-wrap; font-size: var(--text-body); line-height: 1.58; color: var(--fg-soft);
    max-height: 60vh; overflow-y: auto; padding-right: 4px;
  }

  .warn { margin-top: 20px; }
  .ok-msg { margin-top: 20px; font-size: var(--text-body-sm); }
  .ok-msg::before { content: "● "; }
</style>
</head>
<body>

<div id="blocked" class="blocked" style="display:none;"></div>
<div id="app" style="display:none;"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
try { tg?.setHeaderColor("#000000"); } catch (e) {}
const initData = tg?.initData || "";
const params = new URLSearchParams(window.location.search);
const campaignId = params.get("id");

const appEl = document.getElementById("app");
const blockedEl = document.getElementById("blocked");

function showBlocked(text) {
  blockedEl.textContent = text;
  blockedEl.style.display = "block";
  appEl.style.display = "none";
}

function goToLogin() {
  window.location.href = `/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
}

async function apiGet(path) {
  const res = await fetch(`${path}?init_data=${encodeURIComponent(initData)}`, { credentials: "same-origin" });
  if (res.status === 401 && !initData) {
    goToLogin();
    throw new Error("Kirish talab qilinadi");
  }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `Xatolik (${res.status})`);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(path, {
    method: "POST",
    credentials: "same-origin",
    headers: { "X-Telegram-Init-Data": initData, "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 401 && !initData) {
    goToLogin();
    throw new Error("Kirish talab qilinadi");
  }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `Xatolik (${res.status})`);
  return res.json();
}

let heartbeatTimer = null;

function renderCampaign(data) {
  const daysHtml = Array.from({ length: data.day_count }, (_, i) => {
    const day = i + 1;
    const cls = ["day"];
    if (day === data.today_day_number) cls.push("today");
    return `<div class="${cls.join(" ")}" id="day-${day}">${day}</div>`;
  }).join("");

  appEl.innerHTML = `
    <header class="hero compact">
      <div class="iri" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <nav class="hero-nav">
        <span class="wordmark">uchqun</span>
        <span class="eyebrow" style="color: rgba(255,255,255,0.82);">Marra</span>
      </nav>
      <div>
        <p class="hero-meta">${data.book_title} - ${data.day_count} kunlik marra</p>
        <h1 class="hero-title sm">${data.title}</h1>
      </div>
    </header>

    <main class="wrap">
      <div class="about">
        ${data.description ? `<p class="lead">${data.description}</p>` : ""}
        ${data.prize_text ? `<div class="kv"><span class="eyebrow">Sovrin</span><span class="v">${data.prize_text}</span></div>` : ""}
        <div class="kv"><span class="eyebrow">Marra muallifi</span><span class="v">UCHQUN</span></div>
      </div>

      <section class="section" id="join-card" style="display:${data.joined ? "none" : "block"};">
        <span class="eyebrow">Qo'shilish</span>
        <p class="lead" style="margin-bottom: 28px;">Marraga qo'shilib, kunlik ${data.daily_minutes_required} daqiqa o'qishni boshlang.</p>
        <button class="pill block" id="btn-join">Marraga qo'shilish</button>
      </section>

      <div id="active-area" style="display:${data.joined ? "block" : "none"};">
        <section class="section">
          <span class="eyebrow">Bugungi o'qish</span>
          <div class="progress-label"><span id="progress-text">0 / ${data.daily_minutes_required} daq</span><span id="progress-pct">0%</span></div>
          <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
          <div class="days">${daysHtml}</div>
          ${data.is_eliminated ? '<p class="notice warn">Siz ushbu marradan avtomatik chiqarilgansiz - kunlardan biri bajarilmagan.</p>' : ""}
          <p id="completed-msg" class="ok-msg" style="display:none;">Bugungi vazifa bajarildi</p>
        </section>
        <section class="section">
          <span class="eyebrow">${data.book_title}</span>
          <div class="book-text" id="book-text">${data.book_text || ""}</div>
        </section>
      </div>
    </main>
  `;

  document.getElementById("btn-join").addEventListener("click", async () => {
    await apiPost(`/api/marra2/campaigns/${campaignId}/join`);
    await load();
  });

  updateProgress(data.seconds_read_today, data.required_seconds, data.completed_today);
  document.querySelectorAll(".day").forEach((el) => {
    const day = parseInt(el.id.replace("day-", ""), 10);
    if (day < data.today_day_number || (day === data.today_day_number && data.completed_today)) {
      el.classList.add("done");
    }
  });

  if (data.joined && !data.is_eliminated && !data.completed_today) {
    startHeartbeat();
  }
}

function updateProgress(seconds, required, completed) {
  const pct = Math.min(100, Math.round((seconds / required) * 100));
  document.getElementById("progress-bar").style.width = `${pct}%`;
  document.getElementById("progress-pct").textContent = `${pct}%`;
  document.getElementById("progress-text").textContent = `${Math.floor(seconds / 60)} / ${Math.floor(required / 60)} daq`;
  document.getElementById("completed-msg").style.display = completed ? "block" : "none";
}

function startHeartbeat() {
  if (heartbeatTimer) return;
  const HEARTBEAT_SECONDS = 10;
  heartbeatTimer = setInterval(async () => {
    if (document.visibilityState !== "visible") return;
    try {
      const res = await apiPost(`/api/marra2/campaigns/${campaignId}/heartbeat`, { seconds: HEARTBEAT_SECONDS });
      updateProgress(res.seconds_read, res.required_seconds, res.completed);
      if (res.completed) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
        await load();
      }
    } catch (err) {
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }
  }, HEARTBEAT_SECONDS * 1000);
}

async function load() {
  const data = await apiGet(`/api/marra2/campaigns/${campaignId}`);
  renderCampaign(data);
}

(async function init() {
  if (!campaignId) {
    showBlocked("Marra topilmadi (id ko'rsatilmagan).");
    return;
  }
  try {
    await load();
    appEl.style.display = "block";
  } catch (err) {
    showBlocked(err.message);
  }
})();
</script>

</body>
</html>
